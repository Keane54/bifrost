name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR stops the old run of that PR. A run on main always completes, because the
# Release workflow starts after it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      # The postinstall script downloads Electron and builds node-pty from source on Linux.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome CI
        run: pnpm exec biome ci

      - name: Check the Bifrost skills
        run: pnpm check:skills

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

  smoke:
    name: Smoke tests (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The smoke harness starts Bifrost with a test home and a PATH that starts with the fake
      # claude and the fake gh (test/smoke/fake-claude). That PATH has no Homebrew folder, so the
      # gh of the runner is not on it.
      - name: Run smoke tests
        run: pnpm smoke

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 14
