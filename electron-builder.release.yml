# The build of the Release workflow (README, Release flow). It is electron-builder.yml plus the
# Developer ID signature, the hardened runtime and the notarisation. Local builds use
# electron-builder.yml, so they need no certificate.
#
# The workflow gives these environment variables from the secrets of the "release" environment:
# - CSC_KEYCHAIN: the path of a keychain that holds the certificate. The workflow makes this
#   keychain from the CSC_LINK and CSC_KEY_PASSWORD secrets.
# - APPLE_API_KEY (the path of the .p8 file), APPLE_API_KEY_ID and APPLE_API_ISSUER: the App Store
#   Connect key for notarytool. electron-builder staples the ticket to the app.
extends: ./electron-builder.yml
mac:
  identity: The Keyholding Company Limited (2GUX23RPKA)
  hardenedRuntime: true
  notarize: true
# electron-builder writes latest-mac.yml and app-update.yml from this block. semantic-release
# uploads the files, because the scripts pass no --publish always. Local builds have no publish
# block, so they have no app-update.yml and the updater does not start.
publish:
  provider: github
  owner: TheKeyholdingCompany
  repo: bifrost
  releaseType: release
