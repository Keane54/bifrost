appId: com.keyholding.bifrost
productName: Bifrost
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - '!resources/live-mod/tests/**'
  - '!resources/live-mod/tsconfig.json'
  - '!resources/live-mod/.claude-plugin/types/**'
  - '!**/node_modules/node-pty/prebuilds/win32-*/**'
  - '!**/node_modules/node-pty/build/**'
asarUnpack:
  - resources/**
  - '**/node_modules/node-pty/**'
mac:
  target:
    - target: dmg
      arch: universal
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  x64ArchFiles: '**/node_modules/node-pty/prebuilds/**'
dmg:
  artifactName: ${productName}-${version}-universal.${ext}
npmRebuild: false
publish: null
